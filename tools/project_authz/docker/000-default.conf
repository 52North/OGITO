<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Route requests for /authorize directly to the Python script
    ScriptAlias /authorize /var/www/scripts/authorize.fcgi

    # Config passed through to authorize.fcgi via the CGI/FastCGI environment -
    # keep these in sync with appsettings.json's `auth.adminRole` and wherever
    # this container's copy of projects.json is mounted
    SetEnv OGITO_PROJECTS_JSON_PATH "/etc/ogito/projects.json"
    SetEnv OGITO_ADMIN_ROLE "OGITO_ADMIN"

    # OIDC config used by authorize.fcgi to independently validate the
    # caller's Bearer access token itself (signature/issuer/audience/expiry)
    # instead of trusting a client-supplied roles value - keep these in sync
    # with appsettings.json's `auth.issuer`, `auth.customQueryParams.audience`
    # and `auth.rolesClaim` respectively.
    SetEnv OGITO_OIDC_JWKS_URI "https://dev-ew2bbxvh5ycbrurw.us.auth0.com/.well-known/jwks.json"
    SetEnv OGITO_OIDC_ISSUER "https://dev-ew2bbxvh5ycbrurw.us.auth0.com/"
    SetEnv OGITO_OIDC_AUDIENCE "https://ogito.app/backend"
    SetEnv OGITO_ROLES_CLAIM "https://ogito.app/roles"

    # Comma-separated list of JWT signing algorithms accepted when verifying
    # the access token's signature. Must match whatever the IdP actually
    # signs tokens with (Auth0 uses RS256 by default).
    SetEnv OGITO_OIDC_ALGORITHMS "RS256"

    # Set to "false" ONLY if token validation (signature/issuer/audience/
    # expiry) is already guaranteed by whatever sits in front of this
    # service (e.g. mod_auth_openidc rejecting invalid tokens before the
    # request reaches here) - this service will then trust the token's
    # claims as-is without re-verifying them. Defaults to enabled.
    SetEnv OGITO_VALIDATE_TOKEN "true"

    # Comma-separated list of QGIS project filenames (.qgs/.qgz) that stay
    # open even though they're not registered in projects.json at all (e.g.
    # standalone test/dev projects) - everything else not found in
    # projects.json is denied by default. Empty by default.
    SetEnv OGITO_OPEN_PROJECT_FILES ""

    # The folder QGIS project files actually live in (must match the real
    # QGIS Server deployment, e.g. where ogito_starter.qgs is mounted in
    # docker-compose.yml). Matching is always an EXACT full path: each
    # projects.json entry's qgisProjectFilename is joined with this folder
    # and compared against the request's `map` value. Leaving this empty
    # means no path is expected at all - if real requests carry one (as
    # here), this must be set or every request fails closed (403).
    SetEnv QGIS_PROJECTS_FOLDER "/etc/qgisserver/"

    <Directory "/var/www/scripts">
        Options +ExecCGI
        AddHandler fcgid-script .fcgi
        Require all granted

        # this service is only ever called server-to-server by whatever
        # gateway sits in front of QGIS Server/geocoder/image-upload, never
        # directly from a browser, so no CORS headers are needed here
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
