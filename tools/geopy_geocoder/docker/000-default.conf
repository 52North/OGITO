<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Route requests for /geocode directly to the Python script
    ScriptAlias /geocode /var/www/scripts/geocoder.fcgi

    # Give FastCGI enough time for slow network calls to the geocoder
    FcgidIOTimeout 60

    <Directory "/var/www/scripts">
        Options +ExecCGI
        AddHandler fcgid-script .fcgi
        Require all granted

        # --- CORS Configuration ---
        
        # Allow requests from any origin (Change "*" to "https://yourdomain.com" for production)
        Header always set Access-Control-Allow-Origin "*"
        # Allow specific HTTP methods
        Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        

    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>